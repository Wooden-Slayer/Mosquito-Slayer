<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MS Pro - Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Firebase SDK (Compatible Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        body { 
            background: #0f172a; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .glass { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
    </style>
</head>
<body class="text-white min-h-screen">

    <div id="app" class="max-w-md mx-auto relative min-h-screen flex flex-col justify-between pb-24">

        <!-- ADMIN LOGIN SCREEN -->
        <div id="screen-admin-auth" class="screen p-6 min-h-screen flex items-center justify-center">
            <div class="w-full glass rounded-[2.5rem] p-10 shadow-2xl">
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-black italic tracking-tighter">MS <span class="text-blue-500">PRO</span></h1>
                    <p class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em] mt-1">Admin Panel Access</p>
                </div>
                <div id="auth-error" class="hidden bg-red-500/20 text-red-400 p-3 rounded-2xl text-[11px] font-bold mb-5 text-center border border-red-500/30"></div>
                <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                    <input type="password" id="admin-pass" placeholder="Admin Password" required
                        class="w-full p-4 bg-white/10 rounded-2xl border border-white/10 outline-none focus:ring-2 ring-blue-500 text-white placeholder-slate-500 text-sm">
                    <button type="submit" class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white rounded-2xl font-black transition-all">
                        Secure Login
                    </button>
                </form>
            </div>
        </div>

        <!-- ADMIN STATS VIEW -->
        <div id="screen-admin-index" class="screen hidden p-6">
            <div class="mb-8 text-center pt-6">
                <h1 class="text-3xl font-black italic">ADMIN PANEL</h1>
                <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">System Overview</p>
            </div>
            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="glass p-5 rounded-[2rem] shadow-sm">
                    <span class="block text-[10px] font-bold text-slate-400 uppercase">Players</span>
                    <h2 class="text-2xl font-black" id="stat-players">0</h2>
                </div>
                <div class="glass p-5 rounded-[2rem] shadow-sm">
                    <span class="block text-[10px] font-bold text-slate-400 uppercase">Claims</span>
                    <h2 class="text-2xl font-black text-orange-500" id="stat-claims">0</h2>
                </div>
            </div>
            <div class="glass p-6 rounded-[2.5rem] border border-white/10">
                <h3 class="font-black mb-4">Quick Links</h3>
                <div class="space-y-3">
                    <button onclick="showScreen('screen-admin-users')" class="w-full flex items-center justify-between p-4 bg-white/5 rounded-2xl border border-white/5 text-left">
                        <span class="font-bold">Manage Users</span>
                        <i class="fas fa-chevron-right text-blue-500"></i>
                    </button>
                    <button onclick="showScreen('screen-admin-withdrawals')" class="w-full flex items-center justify-between p-4 bg-white/5 rounded-2xl border border-white/5 text-left">
                        <span class="font-bold">Payout Requests</span>
                        <i class="fas fa-chevron-right text-orange-500"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- ADMIN USERS VIEW -->
        <div id="screen-admin-users" class="screen hidden p-6">
            <h1 class="text-2xl font-black mb-6 italic underline decoration-blue-500">Player Database</h1>
            <div id="admin-users-list" class="space-y-4"></div>
        </div>

        <!-- ADMIN WITHDRAWALS VIEW -->
        <div id="screen-admin-withdrawals" class="screen hidden p-6">
            <h1 class="text-2xl font-black mb-6 italic text-orange-500">Pending Payouts</h1>
            <div id="admin-withdrawals-list" class="space-y-4"></div>
        </div>

        <!-- ADMIN SETTINGS VIEW -->
        <div id="screen-admin-settings" class="screen hidden p-6">
            <div class="mb-8">
                <h1 class="text-3xl font-black italic">Settings</h1>
                <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">Admin Security</p>
            </div>
            <form onsubmit="handleAdminPasswordChange(event)" class="space-y-4">
                <div class="glass p-6 rounded-[2.5rem] border border-white/10">
                    <div class="mb-4">
                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Current Password</label>
                        <input type="password" id="admin-old-p" required class="w-full p-4 bg-white/10 rounded-2xl outline-none focus:ring-2 ring-blue-500 font-bold border-none text-white">
                    </div>
                    <div class="mb-4">
                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">New Password</label>
                        <input type="password" id="admin-new-p" required class="w-full p-4 bg-white/10 rounded-2xl outline-none focus:ring-2 ring-blue-500 font-bold border-none text-white">
                    </div>
                    <div class="mb-2">
                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Confirm Password</label>
                        <input type="password" id="admin-conf-p" required class="w-full p-4 bg-white/10 rounded-2xl outline-none focus:ring-2 ring-blue-500 font-bold border-none text-white">
                    </div>
                </div>
                <button type="submit" class="w-full py-5 bg-slate-800 text-white rounded-3xl font-black transition-all">UPDATE PASSWORD</button>
            </form>
        </div>

        <!-- ADMIN NAVIGATION BAR -->
        <div id="admin-nav" class="fixed bottom-6 left-1/2 -translate-x-1/2 w-11/12 max-w-md h-16 glass rounded-3xl flex items-center justify-around px-6 shadow-2xl z-40 hidden">
            <button onclick="showScreen('screen-admin-index')" id="nav-admin-stats" class="flex flex-col items-center text-slate-400">
                <i class="fas fa-chart-line text-xl"></i>
                <span class="text-[10px] font-bold">Stats</span>
            </button>
            <button onclick="showScreen('screen-admin-users')" id="nav-admin-users" class="flex flex-col items-center text-slate-400">
                <i class="fas fa-users text-xl"></i>
                <span class="text-[10px] font-bold">Users</span>
            </button>
            <button onclick="showScreen('screen-admin-withdrawals')" id="nav-admin-payouts" class="flex flex-col items-center text-slate-400">
                <i class="fas fa-indian-rupee-sign text-xl"></i>
                <span class="text-[10px] font-bold">Payouts</span>
            </button>
            <button onclick="showScreen('screen-admin-settings')" id="nav-admin-settings" class="flex flex-col items-center text-slate-400">
                <i class="fas fa-cog text-xl"></i>
                <span class="text-[10px] font-bold">Settings</span>
            </button>
            <button onclick="logout()" class="flex flex-col items-center text-red-500">
                <i class="fas fa-sign-out-alt text-xl"></i>
                <span class="text-[10px] font-bold">Exit</span>
            </button>
        </div>

    </div>

    <script>
        // Initialize Firebase
        const firebaseConfig = {
            databaseURL: "https://mosquito-slayer-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let adminUser = null;

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(el => el.classList.add('hidden'));
            const activeScreen = document.getElementById(screenId);
            if (activeScreen) activeScreen.classList.remove('hidden');

            const adminNav = document.getElementById('admin-nav');
            if (screenId === 'screen-admin-auth') {
                adminNav.classList.add('hidden');
            } else {
                adminNav.classList.remove('hidden');
                updateNavHighlight(screenId);
            }

            if (screenId === 'screen-admin-index') renderAdminIndex();
            if (screenId === 'screen-admin-users') renderAdminUsers();
            if (screenId === 'screen-admin-withdrawals') renderAdminWithdrawals();
        }

        function updateNavHighlight(screenId) {
            document.getElementById('nav-admin-stats').className = screenId === 'screen-admin-index' ? 'flex flex-col items-center text-blue-500' : 'flex flex-col items-center text-slate-400';
            document.getElementById('nav-admin-users').className = screenId === 'screen-admin-users' ? 'flex flex-col items-center text-blue-500' : 'flex flex-col items-center text-slate-400';
            document.getElementById('nav-admin-payouts').className = screenId === 'screen-admin-withdrawals' ? 'flex flex-col items-center text-blue-500' : 'flex flex-col items-center text-slate-400';
            document.getElementById('nav-admin-settings').className = screenId === 'screen-admin-settings' ? 'flex flex-col items-center text-blue-500' : 'flex flex-col items-center text-slate-400';
        }

        async function handleAdminLogin(event) {
            event.preventDefault();
            const passVal = document.getElementById('admin-pass').value;
            const errDiv = document.getElementById('auth-error');

            const adminSnap = await db.ref('users/admin').once('value');
            if (adminSnap.exists() && adminSnap.val().password === passVal) {
                adminUser = adminSnap.val();
                showScreen('screen-admin-index');
            } else {
                errDiv.innerText = "Incorrect Admin Password";
                errDiv.classList.remove('hidden');
            }
        }

        function logout() {
            adminUser = null;
            document.getElementById('admin-pass').value = "";
            showScreen('screen-admin-auth');
        }

        async function renderAdminIndex() {
            const usersSnap = await db.ref('users').once('value');
            const claimsSnap = await db.ref('claims').once('value');

            let playersCount = 0;
            if (usersSnap.exists()) {
                playersCount = Object.values(usersSnap.val()).filter(x => !x.is_admin).length;
            }

            let pendingCount = 0;
            if (claimsSnap.exists()) {
                pendingCount = Object.values(claimsSnap.val()).filter(x => x.status === 'pending').length;
            }

            document.getElementById('stat-players').innerText = playersCount;
            document.getElementById('stat-claims').innerText = pendingCount;
        }

        async function renderAdminUsers() {
            const list = document.getElementById('admin-users-list');
            list.innerHTML = "";
            
            const usersSnap = await db.ref('users').once('value');
            if (!usersSnap.exists()) {
                list.innerHTML = `<p class="text-center opacity-50">No players registered.</p>`;
                return;
            }

            const players = Object.values(usersSnap.val()).filter(x => !x.is_admin);

            players.forEach(u => {
                const box = document.createElement('div');
                box.className = "glass p-6 rounded-[2.5rem] border border-white/10";
                box.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h4 class="font-black text-lg">@${u.username}</h4>
                            <p class="text-[10px] font-mono text-blue-400 font-bold uppercase">${u.upi_id ? 'UPI: ' + u.upi_id : 'UPI: NOT SET'}</p>
                        </div>
                        <button onclick="toggleUserStatus('${u.username}')" class="px-4 py-2 rounded-xl text-[10px] font-black uppercase ${u.status === 'active' ? 'bg-red-500/20 text-red-400' : 'bg-green-500 text-white'}">
                            ${u.status === 'active' ? 'Block' : 'Unblock'}
                        </button>
                    </div>
                    <div class="flex justify-between items-center text-sm font-bold">
                        <span class="text-slate-400">Balance:</span>
                        <span class="text-green-400">₹${u.balance.toFixed(2)}</span>
                    </div>
                `;
                list.appendChild(box);
            });
        }

        async function toggleUserStatus(username) {
            const path = 'users/' + username.toLowerCase();
            const userSnap = await db.ref(path).once('value');
            if (userSnap.exists()) {
                const currentStatus = userSnap.val().status;
                const newStatus = currentStatus === 'active' ? 'blocked' : 'active';
                await db.ref(path).update({ status: newStatus });
                renderAdminUsers();
            }
        }

        async function renderAdminWithdrawals() {
            const list = document.getElementById('admin-withdrawals-list');
            list.innerHTML = "";

            const claimsSnap = await db.ref('claims').once('value');
            if (!claimsSnap.exists()) {
                list.innerHTML = `<div class="text-center py-10 opacity-50"><i class="fas fa-check-circle text-4xl text-green-400 mb-2"></i><p>No pending payouts.</p></div>`;
                return;
            }

            const pending = Object.values(claimsSnap.val()).filter(c => c.status === 'pending');

            if (pending.length === 0) {
                list.innerHTML = `<div class="text-center py-10 opacity-50"><i class="fas fa-check-circle text-4xl text-green-400 mb-2"></i><p>No pending payouts.</p></div>`;
                return;
            }

            pending.forEach(c => {
                const box = document.createElement('div');
                box.className = "glass p-6 rounded-[2.5rem] border border-white/10";
                box.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <span class="bg-orange-500 text-white px-4 py-1 rounded-full text-[10px] font-black">₹${c.amount}</span>
                        <span class="text-[10px] text-slate-400">${c.created_at}</span>
                    </div>
                    <p class="text-xs font-bold text-slate-400 uppercase">Send Money To:</p>
                    <p class="text-lg font-black select-all mb-4 text-white">${c.upi_id}</p>
                    <p class="text-xs italic text-blue-400 font-bold mb-4">User: @${c.username}</p>
                    <button onclick="approveClaim('${c.id}')" class="w-full py-4 bg-slate-800 text-white rounded-2xl font-black shadow-lg">CONFIRM PAID</button>
                `;
                list.appendChild(box);
            });
        }

        async function approveClaim(claimId) {
            await db.ref('claims/' + claimId).update({ status: 'paid' });
            renderAdminWithdrawals();
        }

        async function handleAdminPasswordChange(event) {
            event.preventDefault();
            const oldP = document.getElementById('admin-old-p').value;
            const newP = document.getElementById('admin-new-p').value;
            const confP = document.getElementById('admin-conf-p').value;

            if (adminUser.password !== oldP) { alert("Wrong current password"); return; }
            if (newP !== confP) { alert("Passwords do not match"); return; }

            adminUser.password = newP;
            await db.ref('users/admin').update({ password: newP });

            alert("Password updated!");
            document.getElementById('admin-old-p').value = "";
            document.getElementById('admin-new-p').value = "";
            document.getElementById('admin-conf-p').value = "";
        }

        window.onload = () => {
            showScreen('screen-admin-auth');
        };
    </script>
</body>
</html>
